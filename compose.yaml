services:
  talent-radar:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-talent-radar:local
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      TALENT_RADAR_HOST: "0.0.0.0"
      TALENT_RADAR_PORT: "8765"
      TALENT_RADAR_DB: "/data/talent_radar.db"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      OLLAMA_BASE_URL: "${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
      OLLAMA_TIMEOUT_SECONDS: "${OLLAMA_TIMEOUT_SECONDS:-240}"
      # A container must not try to start a process on the host.
      OLLAMA_AUTOSTART: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - talent-radar-data:/data

volumes:
  talent-radar-data:
